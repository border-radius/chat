name: CI

on:
  push:
  pull_request:

# Static checks first; the test suites then run side by side, e2e once per browser. `npm run check` still runs
# everything but e2e in one go locally.
jobs:
  static:
    name: Typecheck, lint, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:sinks
      - run: npm run build

  unit:
    name: Unit tests
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test

  integration:
    name: Integration tests
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:int

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One browser failing shouldn't cancel (and hide) the others' results.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: "1"
          E2E_SKIP_BUILD: "1" # built just above

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
