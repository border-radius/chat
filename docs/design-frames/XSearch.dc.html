<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search in room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0D16}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0F0D16; font-family: 'Inter', system-ui, sans-serif; color: #ECEAF4; font-size: 14px">
  <dc-import name="Side" active="design" hint-size="280px,900px"></dc-import>
  <main style="flex: 1 1 auto; min-width: 0; height: 900px; display: flex; flex-direction: column; background: #1A1724; position: relative">
    <header style="height: 64px; flex: 0 0 auto; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 28px; border-bottom: 1px solid rgba(255,255,255,0.06)">
      <span style="flex: 1 1 auto; font-size: 18px; font-weight: 700"><span style="color: #6F6A85; font-weight: 600; margin-right: 2px">#</span>design</span>
      <button type="button" aria-label="Search messages" aria-expanded="true" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: rgba(139,108,255,0.2); color: #F3F0FF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
      <button type="button" aria-label="Media" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></button>
      <button type="button" aria-label="Room options" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </header>

    <!-- search bar -->
    <div role="search" style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 20px 10px 28px; border-bottom: 1px solid rgba(255,255,255,0.06); background: #1D1929">
      <label style="flex: 1 1 auto; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; background: #15121E; border: 1px solid rgba(185,166,255,0.6)">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6A1B8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search messages in #design</span>
        <input type="search" value="palette dark" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: #ECEAF4; font: inherit; font-size: 15px; outline: none">
      </label>
      <span role="status" style="font-size: 13px; color: #A6A1B8; white-space: nowrap">4 messages with every word</span>
      <button type="button" aria-label="Close search" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>

    <!-- results -->
    <div role="list" aria-label="Results, newest first" style="flex: 0 0 auto; display: flex; flex-direction: column; padding: 6px 12px 10px; background: #1D1929; border-bottom: 1px solid rgba(255,255,255,0.08); box-shadow: 0 12px 24px rgba(0,0,0,0.3)">
      <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
        <button type="button" role="listitem" style="{{r.row}}">
          <span style="{{r.av}}">{{r.ini}}</span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="display: flex; gap: 8px; align-items: baseline"><span style="font-weight: 600">{{r.name}}</span><span style="font-size: 12px; color: #8F8AA5">{{r.when}}</span></span>
            <span style="line-height: 1.5; color: #C9C5D8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">
              <sc-for list="{{r.parts}}" as="p" hint-placeholder-count="3"><span style="{{p.style}}">{{p.t}}</span></sc-for>
            </span>
          </span>
        </button>
      </sc-for>
      <button type="button" style="align-self: center; margin-top: 6px; height: 34px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; background: transparent; color: #DCD8E8; font-size: 13px; font-weight: 600">Show older results</button>
    </div>

    <!-- picked result, centred and highlighted in the room -->
    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 8px 0; opacity: 0.9">
      <article style="display: flex; gap: 14px; padding: 8px 28px">
        <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; background: #F5C04E; color: #2B1D00; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">SR</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; gap: 8px"><span style="font-weight: 600">Sam Rivera</span><span style="font-size: 12px; color: #8F8AA5">12 Oct, 10:02 AM</span></div><p style="margin: 0; line-height: 1.55; color: #DCD8E8">Can we lock the dark theme before the audit?</p></div>
      </article>
      <article style="display: flex; gap: 14px; margin: 0 16px; padding: 8px 12px; border-radius: 12px; background: rgba(250,204,21,0.10); box-shadow: inset 0 0 0 1px rgba(250,204,21,0.35)">
        <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; background: #F08A5D; color: #2A1206; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">MC</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; gap: 8px"><span style="font-weight: 600">Maya Chen</span><span style="font-size: 12px; color: #8F8AA5">12 Oct, 10:05 AM</span></div><p style="margin: 0; line-height: 1.55; color: #DCD8E8">New <mark style="background: rgba(250,204,21,0.35); color: #FFF7D6; border-radius: 3px; padding: 0 2px">palette</mark> for the <mark style="background: rgba(250,204,21,0.35); color: #FFF7D6; border-radius: 3px; padding: 0 2px">dark</mark> theme is in Figma, page 3.</p></div>
      </article>
      <article style="display: flex; gap: 14px; padding: 8px 28px">
        <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; background: #2DD4BF; color: #04201C; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">LF</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; gap: 8px"><span style="font-weight: 600">Leo Fischer</span><span style="font-size: 12px; color: #8F8AA5">12 Oct, 10:09 AM</span></div><p style="margin: 0; line-height: 1.55; color: #DCD8E8">Looking now.</p></div>
      </article>
    </div>

    <button type="button" style="position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 17px; background: #221E2F; color: #C9C5D8; font-size: 13px; font-weight: 600">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"></path></svg>Jump to latest
    </button>

    <div style="flex: 0 0 auto; height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 14px 0 12px; border-top: 1px solid rgba(255,255,255,0.06)">
      <button type="button" aria-label="Attach" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
      <label style="flex: 1 1 auto; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</span><input type="text" placeholder="Message #design" style="flex: 1 1 auto; height: 40px; padding: 0 6px; border: 0; background: transparent; color: #ECEAF4; font: inherit; outline: none"></label>
      <button type="button" aria-label="Send" disabled style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: rgba(109,74,255,0.25); color: rgba(255,255,255,0.55)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var people = {
      LF: ['Leo Fischer', '#2DD4BF', '#04201C'], AM: ['Alex Morgan', '#B794F6', '#22113F'],
      MC: ['Maya Chen', '#F08A5D', '#2A1206'], PN: ['Priya Nair', '#38BDF8', '#04263A']
    };
    var hit = 'background:rgba(250,204,21,0.30);color:#FFF7D6;border-radius:3px;padding:0 2px;';
    var data = [
      ['AM', 'Today, 3:38 PM', [['Final '], ['palette', 1], [': plum, ink, blush. Contrast checked against light and '], ['dark', 1], ['.']]],
      ['PN', 'Yesterday, 6:12 PM', [['The '], ['dark', 1], [' theme '], ['palette', 1], [' still clips the blush on cheap panels.']]],
      ['MC', '12 Oct, 10:05 AM', [['New '], ['palette', 1], [' for the '], ['dark', 1], [' theme is in Figma, page 3.']], true],
      ['LF', '3 Oct, 2:40 PM', [['Is the '], ['Dark', 1], [' mode '], ['palette', 1], [' tokenised yet or still hex?']]]
    ];
    return {
      results: data.map(function (d) {
        var p = people[d[0]];
        return {
          ini: d[0], name: p[0], when: d[1],
          parts: d[2].map(function (x) { return { t: x[0], style: x[1] ? hit : '' }; }),
          row: 'display:flex;gap:12px;padding:8px 12px;border:0;border-radius:10px;text-align:left;color:#ECEAF4;background:' + (d[3] ? 'rgba(139,108,255,0.16)' : 'transparent') + ';',
          av: 'width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:' + p[1] + ';color:' + p[2] + ';font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;'
        };
      })
    };
  }
}
</script>
</body>
</html>
