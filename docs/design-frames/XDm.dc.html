<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direct message</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0D16}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0F0D16; font-family: 'Inter', system-ui, sans-serif; color: #ECEAF4; font-size: 14px">
  <dc-import name="Side" active="sam" dm-menu="{{true}}" hint-size="280px,900px"></dc-import>
  <main style="flex: 1 1 auto; min-width: 0; height: 900px; display: flex; flex-direction: column; background: #1A1724; position: relative">
    <header style="height: 64px; flex: 0 0 auto; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 28px; border-bottom: 1px solid rgba(255,255,255,0.06)">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #F5C04E; color: #2B1D00; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">SR</span>
      <span style="flex: 1 1 auto; font-size: 18px; font-weight: 700">Sam Rivera</span>
      <button type="button" aria-label="Search messages" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
      <button type="button" aria-label="Media" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></button>
      <button type="button" aria-label="Conversation options" aria-haspopup="menu" aria-expanded="true" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: rgba(139,108,255,0.2); color: #F3F0FF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </header>
    <div role="menu" aria-label="Conversation options" style="position: absolute; top: 56px; right: 20px; z-index: 6; width: 260px; display: flex; flex-direction: column; padding: 6px; border-radius: 12px; background: #221E2F; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 16px 40px rgba(0,0,0,0.5)">
      <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.05); color: #ECEAF4; text-align: left"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C5D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path><path d="m9 9 6 6M15 9l-6 6"></path></svg>Close conversation</button>
      <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #ECEAF4; text-align: left"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9C5D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14M12 21V8M6 13l6-6 6 6"></path></svg>Jump to beginning</button>
    </div>

    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 0 10px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 28px 28px">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #F5C04E; color: #2B1D00; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center">SR</span>
        <span style="font-size: 15px; color: #C9C5D8">Beginning of your conversation with <span style="font-weight: 700; color: #ECEAF4">Sam Rivera</span></span>
      </div>
      <article style="display: flex; gap: 14px; padding: 6px 28px">
        <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; background: #F5C04E; color: #2B1D00; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">SR</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; gap: 8px"><span style="font-weight: 600">Sam Rivera</span><span style="font-size: 12px; color: #8F8AA5">11:20 AM</span></div><p style="margin: 0; line-height: 1.55; color: #DCD8E8">Got a minute to look at the release notes draft?</p></div>
      </article>
      <article style="display: flex; gap: 14px; padding: 10px 28px 6px">
        <span style="width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; background: #B794F6; color: #22113F; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">AM</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; gap: 8px"><span style="font-weight: 600">Alex Morgan</span><span style="font-size: 12px; color: #8F8AA5">11:24 AM</span></div><p style="margin: 0; line-height: 1.55; color: #DCD8E8">Sure, send it over.</p></div>
      </article>
    </div>

    <div style="flex: 0 0 auto; height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 14px 0 12px; border-top: 1px solid rgba(255,255,255,0.06)">
      <button type="button" aria-label="Attach" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
      <label style="flex: 1 1 auto; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</span><input type="text" placeholder="Message Sam Rivera" style="flex: 1 1 auto; height: 40px; padding: 0 6px; border: 0; background: transparent; color: #ECEAF4; font: inherit; outline: none"></label>
      <button type="button" aria-label="Send" disabled style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: rgba(109,74,255,0.25); color: rgba(255,255,255,0.55)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
  </main>

  <!-- New DM: user search, from the + beside Direct messages -->
  <div role="dialog" aria-label="New direct message" style="position: absolute; left: 236px; top: 392px; z-index: 8; width: 320px; display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 14px; background: #221E2F; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 48px rgba(0,0,0,0.6)">
    <label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-radius: 9px; background: #15121E; border: 1px solid rgba(185,166,255,0.6)">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F8AA5" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find a person</span>
      <input type="search" value="ri" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; color: #ECEAF4; font: inherit; outline: none">
    </label>
    <div role="listbox" aria-label="People" style="display: flex; flex-direction: column">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
        <button type="button" role="option" aria-selected="{{p.sel}}" style="{{p.row}}"><span style="{{p.av}}">{{p.ini}}</span><span style="flex: 1 1 auto">{{p.name}}</span><sc-if value="{{p.peer}}" hint-placeholder-val="{{false}}"><span style="height: 18px; padding: 0 6px; border-radius: 4px; background: rgba(45,212,191,0.14); color: #5EEAD4; font-size: 10px; font-weight: 700; display: flex; align-items: center">{{p.peer}}</span></sc-if></button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      people: [
        { name: 'Priya Nair', ini: 'PN', bg: '#38BDF8', fg: '#04263A', sel: true },
        { name: 'Rina Okoye', ini: 'RO', bg: '#A3E635', fg: '#1A2E05', peer: 'B' },
        { name: 'Sam Rivera', ini: 'SR', bg: '#F5C04E', fg: '#2B1D00' }
      ].map(function (p) {
        return {
          name: p.name, ini: p.ini, sel: !!p.sel, peer: p.peer || '',
          row: 'display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;border:0;border-radius:8px;text-align:left;color:#ECEAF4;background:' + (p.sel ? 'rgba(139,108,255,0.18)' : 'transparent') + ';',
          av: 'width:26px;height:26px;border-radius:50%;background:' + p.bg + ';color:' + p.fg + ';font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;'
        };
      })
    };
  }
}
</script>
</body>
</html>
