<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selecting messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0D16}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0F0D16; font-family: 'Inter', system-ui, sans-serif; color: #ECEAF4; font-size: 14px">
  <dc-import name="Side" active="design" hint-size="280px,900px"></dc-import>
  <main style="flex: 1 1 auto; min-width: 0; height: 900px; display: flex; flex-direction: column; background: #1A1724">
    <header style="height: 64px; flex: 0 0 auto; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 28px; border-bottom: 1px solid rgba(255,255,255,0.06)">
      <span style="flex: 1 1 auto; font-size: 18px; font-weight: 700"><span style="color: #6F6A85; font-weight: 600; margin-right: 2px">#</span>design</span>
      <button type="button" aria-label="Search messages" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
      <button type="button" aria-label="Media" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></button>
      <button type="button" aria-label="Room options" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </header>

    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 0 10px; gap: 2px">
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="6">
        <label style="{{m.row}}">
          <input type="checkbox" checked="{{m.on}}" aria-label="{{m.aria}}" style="width: 18px; height: 18px; margin: 9px 0 0; flex: 0 0 auto; accent-color: #8B6CFF">
          <span style="{{m.av}}">{{m.ini}}</span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 600">{{m.name}}</span><span style="font-size: 12px; color: #8F8AA5">{{m.time}}</span></span>
            <span style="line-height: 1.55; color: #DCD8E8">{{m.text}}</span>
            <sc-if value="{{m.photo}}" hint-placeholder-val="{{false}}"><span style="width: 240px; aspect-ratio: 16 / 10; border-radius: 10px; background: #2A2340"></span></sc-if>
          </span>
        </label>
      </sc-for>
    </div>

    <div role="toolbar" aria-label="Selection" style="flex: 0 0 auto; height: 68px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 24px; border-top: 1px solid rgba(255,255,255,0.06); background: #201C2D">
      <span style="flex: 1 1 auto; font-weight: 600">3 selected</span>
      <button type="button" style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 10px; background: #6D4AFF; color: #FFFFFF; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 17 5-5-5-5"></path><path d="M4 18v-2a4 4 0 0 1 4-4h12"></path></svg>Forward</button>
      <button type="button" style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid rgba(248,113,113,0.4); border-radius: 10px; background: transparent; color: #FCA5A5; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>Delete</button>
      <button type="button" style="height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #DCD8E8; font-weight: 600">Cancel</button>
    </div>
    <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px 0 24px; background: rgba(248,113,113,0.08); border-top: 1px solid rgba(248,113,113,0.25)">
      <span style="flex: 1 1 auto; font-size: 13px; color: #FECACA">Delete these 3 messages?</span>
      <button type="button" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: #DC2626; color: #FFFFFF; font-size: 13px; font-weight: 600">Delete</button>
      <button type="button" style="height: 32px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: transparent; color: #ECEAF4; font-size: 13px; font-weight: 600">Cancel</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var people = {
      LF: ['Leo Fischer', '#2DD4BF', '#04201C'], AM: ['Alex Morgan', '#B794F6', '#22113F'],
      MC: ['Maya Chen', '#F08A5D', '#2A1206'], SR: ['Sam Rivera', '#F5C04E', '#2B1D00']
    };
    var data = [
      ['LF', '3:35 PM', 'Can someone post the final palette here before I export the tokens?', false, false],
      ['AM', '3:38 PM', 'Final palette: plum #6D4AFF, ink #15121E, blush #F9A8D4.', true, false],
      ['AM', '3:39 PM', 'Here is the board with all three on light and dark.', true, true],
      ['MC', '3:41 PM', 'Agreed. It finally reads well on OLED too.', false, false],
      ['AM', '3:44 PM', 'Tokens are in the shared folder too.', true, false],
      ['SR', '3:49 PM', 'Looks great. Shipping it with 2.4.', false, false]
    ];
    return {
      msgs: data.map(function (d) {
        var p = people[d[0]];
        return {
          ini: d[0], name: p[0], time: d[1], text: d[2], on: d[3], photo: d[4],
          aria: 'Select message from ' + p[0] + ', ' + d[1],
          row: 'display:flex;gap:14px;padding:8px 28px 8px 24px;cursor:pointer;' + (d[3] ? 'background:rgba(139,108,255,0.14);' : ''),
          av: 'width:36px;height:36px;flex:0 0 auto;border-radius:50%;background:' + p[1] + ';color:' + p[2] + ';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;'
        };
      })
    };
  }
}
</script>
</body>
</html>
