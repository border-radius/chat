<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shared sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
button{font:inherit}
</style>
</helmet>
<nav aria-label="Workspace" style="width: 280px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 14px 12px 0; background: #15121E; border-right: 1px solid rgba(255,255,255,0.06); overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #ECEAF4; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px">
    <span aria-hidden="true" style="width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; border-bottom-left-radius: 28% 30%; background: linear-gradient(135deg, #7A5AF8 0%, #A43FD0 55%, #D2389E 100%)"></span>
    <span style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em">Chirkle</span>
  </div>
  <button type="button" style="margin: 8px 2px 6px; display: flex; align-items: center; gap: 10px; height: 38px; box-sizing: border-box; padding: 0 8px 0 12px; border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; background: #1B1726; color: #8F8AA5; cursor: pointer; text-align: left; font-size: 14px">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="flex: 1 1 auto">Jump to…</span>
    <span style="font-size: 11px; font-weight: 600; color: #A6A1B8; border: 1px solid rgba(255,255,255,0.1); border-radius: 5px; padding: 2px 6px">⌘K</span>
  </button>
  <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 6px 4px 8px"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 4px">
    <span style="display: flex; align-items: center; gap: 6px; height: 28px; color: #8F8AA5; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>{{roomsLabel}}</span>
    <sc-if value="{{member}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="New room" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: #8F8AA5"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></sc-if>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
      <button type="button" style="{{r.row}}">
        <span style="{{r.hash}}">#</span>
        <span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
        <sc-if value="{{r.isPrivate}}" hint-placeholder-val="{{false}}"><svg aria-label="Private" role="img" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F8AA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
        <sc-if value="{{r.isOpenAir}}" hint-placeholder-val="{{false}}"><svg aria-label="Open air" role="img" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F8AA5" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></sc-if>
        <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: #6D4AFF; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.unread}}</span></sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{member}}" hint-placeholder-val="{{true}}">
  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 4px 4px">
      <span style="display: flex; align-items: center; gap: 6px; height: 28px; color: #8F8AA5; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>Direct messages</span>
      <button type="button" aria-label="New direct message" style="{{dmPlus}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <sc-for list="{{dms}}" as="d" hint-placeholder-count="2">
      <button type="button" style="{{d.row}}">
        <span style="{{d.av}}">{{d.ini}}</span>
        <span style="flex: 1 1 auto">{{d.name}}</span>
        <sc-if value="{{d.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: #6D4AFF; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{d.unread}}</span></sc-if>
      </button>
    </sc-for>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 4px 4px">
      <span style="display: flex; align-items: center; gap: 6px; height: 28px; color: #8F8AA5; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>Collections</span>
      <button type="button" aria-label="New collection" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: #8F8AA5"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <sc-for list="{{collections}}" as="c" hint-placeholder-count="3">
      <button type="button" style="{{c.row}}">
        <span style="{{c.icon}}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="{{c.nameStyle}}">{{c.name}}</span><sc-if value="{{c.owner}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #8F8AA5">{{c.owner}}</span></sc-if></span>
        <sc-if value="{{c.locked}}" hint-placeholder-val="{{false}}"><svg aria-label="Private" role="img" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8F8AA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
        <sc-if value="{{c.fresh}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: #6D4AFF; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.fresh}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"> new</span></span></sc-if>
      </button>
    </sc-for>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 4px 4px">
      <span style="display: flex; align-items: center; gap: 6px; height: 28px; color: #8F8AA5; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(-90deg)"><path d="m6 9 6 6 6-6"></path></svg>Hidden &amp; archived</span>
      <span style="font-size: 12px; font-weight: 600; color: #8F8AA5; padding-right: 8px">6</span>
    </div>
  </div>
  </sc-if>

  <div style="flex: 1 1 auto"></div>

  <sc-if value="{{member}}" hint-placeholder-val="{{true}}">
  <div style="margin: 6px -12px 0; height: 68px; flex: 0 0 auto; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-top: 1px solid rgba(255,255,255,0.06)">
    <span style="width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; background: #B794F6; color: #22113F; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">AM</span>
    <span style="flex: 1 1 auto; font-weight: 600">Alex Morgan</span>
    <button type="button" aria-label="Settings" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></button>
  </div>
  </sc-if>
  <sc-if value="{{guest}}" hint-placeholder-val="{{false}}">
  <div style="margin: 6px -12px 0; flex: 0 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 18px; border-top: 1px solid rgba(255,255,255,0.06)">
    <span style="font-size: 13px; color: #A6A1B8; line-height: 1.45">You're reading as a guest. Only Open Air rooms are listed.</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="XLogin.dc.html" style="height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); color: #ECEAF4; font-weight: 600; text-decoration: none">Log in</a>
      <a href="XLogin.dc.html" style="height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #6D4AFF; color: #FFFFFF; font-weight: 600; text-decoration: none">Sign up</a>
    </div>
  </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"design"},"guest":{"editor":"boolean","default":false},"dmMenu":{"editor":"boolean","default":false},"$preview":{"width":280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'design';
    var guest = !!this.props.guest;
    var data = guest
      ? [{ id: 'announcements', unread: 0, vis: 'openair' }, { id: 'random', unread: 0, vis: 'openair' }, { id: 'town-hall', unread: 0, vis: 'openair' }]
      : [
        { id: 'general', unread: 3, vis: 'public' },
        { id: 'release-2.4', unread: 7, vis: 'private' },
        { id: 'support', unread: 1, vis: 'public' },
        { id: 'announcements', unread: 0, vis: 'openair' },
        { id: 'design', unread: 0, vis: 'private' },
        { id: 'random', unread: 0, vis: 'openair' }
      ];
    var base = 'display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:8px;text-align:left;font-size:14px;width:100%;box-sizing:border-box;';
    var rooms = data.map(function (r) {
      var on = r.id === active;
      var unread = !on && r.unread > 0;
      return {
        name: r.id, unread: r.unread, hasBadge: unread,
        isPrivate: r.vis === 'private', isOpenAir: r.vis === 'openair',
        row: base + (on ? 'background:rgba(139,108,255,0.16);color:#F3F0FF;font-weight:600;' : 'background:transparent;color:' + (unread ? '#ECEAF4;font-weight:600;' : '#A6A1B8;font-weight:500;')),
        hash: 'width:16px;text-align:center;font-weight:600;color:' + (on ? '#B9A6FF' : '#6F6A85') + ';'
      };
    });
    var dmBase = 'display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:8px;text-align:left;font-size:14px;';
    var dms = [
      { id: 'maya', name: 'Maya Chen', ini: 'MC', bg: '#F08A5D', fg: '#2A1206', unread: 1 },
      { id: 'sam', name: 'Sam Rivera', ini: 'SR', bg: '#F5C04E', fg: '#2B1D00', unread: 0 }
    ].map(function (d) {
      var on = d.id === active;
      var unread = !on && d.unread > 0;
      return {
        name: d.name, ini: d.ini, unread: d.unread, hasBadge: unread,
        row: dmBase + (on ? 'background:rgba(139,108,255,0.16);color:#F3F0FF;font-weight:600;' : 'background:transparent;color:' + (unread ? '#ECEAF4;font-weight:600;' : '#A6A1B8;font-weight:500;')),
        av: 'width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:' + d.bg + ';color:' + d.fg + ';font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;'
      };
    });
    var tints = [['#2A2340', '#C4B5FD'], ['#1F2E3A', '#7DD3FC'], ['#2A3320', '#BEF264']];
    var collections = [
      { name: 'Moodboard', locked: true, owner: '', fresh: 0 },
      { name: 'Screenshots', locked: false, owner: '', fresh: 0 },
      { name: 'Field notes', locked: false, owner: 'Priya Nair', fresh: 5 }
    ].map(function (c, i) {
      c.icon = 'width:24px;height:24px;flex:0 0 auto;border-radius:7px;display:flex;align-items:center;justify-content:center;background:' + tints[i][0] + ';color:' + tints[i][1] + ';';
      var on = c.name === active;
      if (on) c.fresh = 0;
      c.nameStyle = on ? 'color:#F3F0FF;font-weight:600;' : c.fresh ? 'color:#ECEAF4;font-weight:600;' : '';
      c.row = 'display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:8px;color:#A6A1B8;font-weight:500;text-align:left;font-size:14px;background:' + (on ? 'rgba(139,108,255,0.16)' : 'transparent') + ';';
      return c;
    });
    var dmOpen = !!this.props.dmMenu;
    return {
      rooms: rooms, dms: dms, collections: collections,
      guest: guest, member: !guest,
      roomsLabel: guest ? 'Open Air rooms' : 'Rooms',
      dmPlus: 'width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:0;border-radius:6px;color:' + (dmOpen ? '#F3F0FF;background:rgba(139,108,255,0.28);' : '#8F8AA5;background:transparent;')
    };
  }
}
</script>
</body>
</html>
