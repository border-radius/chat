<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile web rooms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #15121E; font-family: 'Inter', system-ui, sans-serif; color: #ECEAF4; font-size: 15px">
  <!-- top bar -->
  <header style="height: 60px; flex: 0 0 auto; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; border-bottom: 1px solid rgba(255,255,255,0.06)">
    <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; border-bottom-left-radius: 28% 30%; background: linear-gradient(135deg, #7A5AF8 0%, #A43FD0 55%, #D2389E 100%)"></span>
    <span style="flex: 1 1 auto; font-weight: 700; font-size: 17px; letter-spacing: -0.01em">Chirkle</span>
    <button type="button" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #C9C5D8; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    <button type="button" aria-label="Alex Morgan, profile and settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; cursor: pointer; padding: 0"><span style="width: 32px; height: 32px; border-radius: 50%; background: #B794F6; color: #22113F; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">AM</span></button>
  </header>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 10px 24px; display: flex; flex-direction: column; gap: 2px">
    <!-- Rooms -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 0 2px">
      <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #8F8AA5; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>Rooms</button>
      <button type="button" aria-label="New room" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #8F8AA5; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="6">
      <a href="WebChat.dc.html" style="{{r.style}}">
        <span style="width: 18px; text-align: center; font-weight: 600; color: #6F6A85">#</span>
        <span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
        <sc-if value="{{r.isPrivate}}" hint-placeholder-val="{{false}}"><svg aria-label="Private" role="img" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8F8AA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
        <sc-if value="{{r.isOpenAir}}" hint-placeholder-val="{{false}}"><svg aria-label="Open air" role="img" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8F8AA5" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></sc-if>
        <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 7px; border-radius: 11px; background: #6D4AFF; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.unread}}</span></sc-if>
      </a>
    </sc-for>

    <!-- DMs -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0 2px">
      <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #8F8AA5; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>Direct messages</button>
      <button type="button" aria-label="New direct message" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #8F8AA5; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <a href="WebChat.dc.html" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #ECEAF4; font-weight: 600">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #F08A5D; color: #2A1206; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">MC</span>
      <span style="flex: 1 1 auto">Maya Chen</span>
      <span style="min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 7px; border-radius: 11px; background: #6D4AFF; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
    </a>
    <a href="WebChat.dc.html" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #A6A1B8; font-weight: 500">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #F5C04E; color: #2B1D00; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">SR</span>
      <span style="flex: 1 1 auto">Sam Rivera</span>
    </a>

    <!-- Collections -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0 2px">
      <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #8F8AA5; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>Collections</button>
      <button type="button" aria-label="New collection" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #8F8AA5; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <sc-for list="{{collections}}" as="c" hint-placeholder-count="3">
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #A6A1B8; font-weight: 500">
        <span style="{{c.iconStyle}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg></span>
        <span style="flex: 1 1 auto">{{c.name}}</span>
        <sc-if value="{{c.locked}}" hint-placeholder-val="{{false}}"><svg aria-label="Private" role="img" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8F8AA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
        <span style="font-size: 13px; color: #8F8AA5">{{c.count}}</span>
      </a>
    </sc-for>

    <!-- Hidden & archived -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0 2px">
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #8F8AA5; font-size: 13px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(-90deg)"><path d="m6 9 6 6 6-6"></path></svg>Hidden &amp; archived</button>
      <span style="font-size: 13px; font-weight: 600; color: #8F8AA5; padding-right: 14px">6</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      { name: 'general', unread: 3, vis: 'public' },
      { name: 'release-2.4', unread: 7, vis: 'private' },
      { name: 'support', unread: 1, vis: 'public' },
      { name: 'announcements', unread: 0, vis: 'openair' },
      { name: 'design', unread: 0, vis: 'private' },
      { name: 'random', unread: 0, vis: 'openair' }
    ];
    var rooms = data.map(function (r) {
      var u = r.unread > 0;
      return {
        name: r.name, unread: r.unread, hasBadge: u,
        isPrivate: r.vis === 'private', isOpenAir: r.vis === 'openair',
        style: 'display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-radius:10px;text-decoration:none;color:' + (u ? '#ECEAF4;font-weight:600;' : '#A6A1B8;font-weight:500;')
      };
    });
    var tints = [['#2A2340', '#C4B5FD'], ['#1F2E3A', '#7DD3FC'], ['#3A2620', '#FDBA8C']];
    var collections = [
      { name: 'Moodboard', count: 48, locked: true },
      { name: 'Screenshots', count: 126, locked: false },
      { name: 'Brand assets', count: 12, locked: false }
    ].map(function (c, i) {
      c.iconStyle = 'width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:' + tints[i][0] + ';color:' + tints[i][1] + ';';
      return c;
    });
    return { rooms: rooms, collections: collections };
  }
}
</script>
</body>
</html>
