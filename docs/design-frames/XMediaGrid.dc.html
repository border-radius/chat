<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room media grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0D16}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; color: #ECEAF4; font-size: 14px">
  <dc-import name="XEdit" hint-size="1440px,900px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,6,14,0.7)"></div>
  <div role="dialog" aria-label="Media in #design" style="position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: 880px; height: 788px; display: flex; flex-direction: column; border-radius: 16px; background: #1D1929; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 24px 64px rgba(0,0,0,0.55); overflow: hidden">
    <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px 24px; border-bottom: 1px solid rgba(255,255,255,0.06)">
      <span style="flex: 1 1 auto; font-size: 17px; font-weight: 700">Media in <span style="color: #6F6A85">#</span>design</span>
      <button type="button" aria-label="Close" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #A6A1B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 14px 24px 20px">
      <sc-for list="{{months}}" as="mo" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h3 style="margin: 6px 0 0; font-size: 13px; font-weight: 600; color: #A6A1B8">{{mo.label}}</h3>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{mo.tiles}}" as="t" hint-placeholder-count="12">
              <div style="position: relative">
                <button type="button" aria-label="{{t.label}}" style="{{t.style}}">
                  <sc-if value="{{t.video}}" hint-placeholder-val="{{false}}"><span style="width: 40px; height: 40px; border-radius: 50%; background: rgba(15,13,22,0.7); display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z"></path></svg></span></sc-if>
                </button>
                <sc-if value="{{t.hover}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="Save to collection" style="position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: rgba(15,13,22,0.75); color: #FFFFFF"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h5"></path><circle cx="9" cy="9" r="2"></circle><path d="m21 13-3-3-6 6"></path><path d="M18 16v6M15 19h6"></path></svg></button></sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <span role="status" style="align-self: center; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A6A1B8"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); border-top-color: #B9A6FF"></span>Loading older media…</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var colors = ['#3B2A4F', '#4A2F3A', '#2F3A4A', '#2A3B33', '#4A4030', '#33304A', '#2A2340', '#3A2620', '#1F2E3A', '#38283F', '#283A3A', '#40302A'];
    function tiles(n, offset, videos, hoverAt) {
      var out = [];
      for (var i = 0; i < n; i++) {
        var v = videos.indexOf(i) >= 0;
        out.push({
          video: v, hover: i === hoverAt,
          label: (v ? 'Video' : 'Image') + ' ' + (i + 1),
          style: 'width:100%;aspect-ratio:1;border:0;border-radius:8px;display:flex;align-items:center;justify-content:center;background:' + colors[(i + offset) % colors.length] + ';' + (i === hoverAt ? 'box-shadow:0 0 0 2px #B9A6FF;' : '')
        });
      }
      return out;
    }
    return {
      months: [
        { label: 'October 2026', tiles: tiles(12, 0, [3, 8], 1) },
        { label: 'September 2026', tiles: tiles(6, 5, [2], -1) }
      ]
    };
  }
}
</script>
</body>
</html>
